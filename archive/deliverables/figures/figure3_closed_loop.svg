   <g id="text_20">
    <text style="font-style: italic; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7f7f7f" x="122.947324" y="262.629763" transform="rotate(-0 122.947324 262.629763)">no accessible resource</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="109.859688" y="15.558281" transform="rotate(-0 109.859688 15.558281)">What untestable targets need, and what that measurement delivers</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(44.843688 332.001848)">Dark bar: share of the 232 untestable cardiovascular targets that would require this measurement.   Pale bar: share of all cardiovascular targets that</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(44.843688 340.883871)">measurement can actually test today. Nearly half of untestable targets need heart or vessel tissue, the measurement that can test only 7.1% of all cardiovascular targets.</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(44.843688 349.765895)">Circulating-protein data would cover a further 6.5%, but no resource is accessible: UK Biobank-PPP requires credentials and deCODE could not be verified.</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(44.843688 358.647918)">Reproduce: python src/cv_atlas.py ; python src/make_figures.py</text>
  </g>
