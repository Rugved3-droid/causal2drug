  <g id="text_24">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 319.041848)">Blood is used because samples are abundant, not because it is where cardiovascular drugs act. Heart, vessel and liver samples are scarce, so far fewer</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 327.923871)">targets reach the threshold for a usable genetic test. Reproduce: python src/cv_atlas.py ; python src/make_figures.py</text>
  </g>
