   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="136.234" y="15.558281" transform="rotate(-0 136.234 15.558281)">Targets we cannot test are disproportionately tissue-restricted</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(77.266 253.161848)">Values above 1 mean untestable targets are more likely to be expressed in only a few tissues. The attrition is therefore not random: it removes a specific kind</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(77.266 262.043871)">of target, and does so slightly more strongly among cardiovascular targets than across all drug targets. Counts are the targets carrying the tissue-specificity</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(77.266 270.925895)">annotation needed for the comparison, which is fewer than the full sets (630 cardiovascular, 594 strict).</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(77.266 279.807918)">Reproduce: python src/a2_robustness.py ; python src/make_figures.py</text>
  </g>
 </g>
