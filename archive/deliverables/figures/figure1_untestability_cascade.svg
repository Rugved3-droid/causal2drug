   </g>
  </g>
  <g id="text_23">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 350.523566)">Testable means a common genetic variant exists that measurably changes the target's activity in blood, so the target's effect on disease can be estimated</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 359.40559)">from human genetics. A further 12 targets (1.9%) could not be matched to a gene record and are excluded from the three groups above.</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 368.287613)">Reproduce: python src/cv_atlas.py ; python src/make_figures.py</text>
  </g>
