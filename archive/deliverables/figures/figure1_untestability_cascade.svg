   </g>
   <g id="text_6">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="148.9968" y="125.72967" transform="rotate(-0 148.9968 125.72967)">177 targets  (28.1%)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="148.9968" y="149.906561" transform="rotate(-0 148.9968 149.906561)">not detectable in blood</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="148.9968" y="169.038038" transform="rotate(-0 148.9968 169.038038)">18 have an approved medicine</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="312.156" y="108.435702" transform="rotate(-0 312.156 108.435702)">TESTED, NO SIGNAL</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="312.156" y="125.72967" transform="rotate(-0 312.156 125.72967)">55 targets  (8.7%)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="312.156" y="149.906561" transform="rotate(-0 312.156 149.906561)">no usable genetic marker</text>
   </g>
   <g id="text_12">
