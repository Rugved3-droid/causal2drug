   </g>
   <g id="text_20">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="230.5764" y="278.9715" transform="rotate(-0 230.5764 278.9715)">PCSK9, NPC1L1 (ezetimibe), APOC3 and ANGPTL3</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0072b2" x="475.3152" y="239.9325" transform="rotate(-0 475.3152 239.9325)">386 targets</text>
