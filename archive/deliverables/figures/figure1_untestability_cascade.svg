   </g>
   <g id="text_18">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d55e00" x="230.5764" y="242.9355" transform="rotate(-0 230.5764 242.9355)">232 targets  (36.8% of all cardiovascular targets)</text>
