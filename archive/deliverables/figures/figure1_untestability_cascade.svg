   </g>
   <g id="text_14">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="475.3152" y="125.72967" transform="rotate(-0 475.3152 125.72967)">386 targets  (61.3%)</text>
